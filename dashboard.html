<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TileTest Vendor Dashboard</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        :root {
            color-scheme: light;
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f3f5f7;
            color: #1a1f26;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #f3f5f7;
        }

        .dashboard-shell {
            width: min(1120px, calc(100% - 32px));
            margin: 0 auto;
            padding: 28px 0;
        }

        .dashboard-header {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            align-items: center;
            margin-bottom: 20px;
        }

        h1,
        h2 {
            margin: 0;
            line-height: 1.2;
        }

        h1 {
            font-size: 1.75rem;
            font-weight: 760;
        }

        h2 {
            font-size: 1rem;
            font-weight: 720;
        }

        .dashboard-link,
        button {
            min-height: 40px;
            padding: 0 14px;
            border: 1px solid #8a95a3;
            border-radius: 6px;
            background: #ffffff;
            color: #1a1f26;
            font: inherit;
            text-decoration: none;
            cursor: pointer;
        }

        .dashboard-link {
            display: inline-flex;
            align-items: center;
        }

        button[type="submit"] {
            border-color: #1d5f8f;
            background: #1d5f8f;
            color: #ffffff;
            font-weight: 700;
        }

        .dashboard-workspace {
            display: grid;
            grid-template-columns: 220px minmax(0, 1fr);
            gap: 18px;
            align-items: start;
        }

        .panel {
            padding: 18px;
            border: 1px solid #d5dbe3;
            border-radius: 8px;
            background: #ffffff;
            box-shadow: 0 1px 2px rgba(17, 24, 39, 0.06);
        }

        .dashboard-tabs {
            position: sticky;
            top: 18px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .dashboard-tab {
            width: 100%;
            text-align: left;
            border-color: #d5dbe3;
            background: #ffffff;
        }

        .dashboard-tab[aria-selected="true"] {
            border-color: #1d5f8f;
            background: #e7f2fb;
            color: #164f78;
            font-weight: 760;
        }

        .dashboard-page[hidden] {
            display: none;
        }

        .form-stack,
        .content-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        label {
            display: flex;
            flex-direction: column;
            gap: 7px;
            font-size: 0.88rem;
            font-weight: 700;
            color: #344054;
        }

        select,
        input,
        textarea {
            width: 100%;
            box-sizing: border-box;
            border: 1px solid #b9c1cc;
            border-radius: 6px;
            padding: 10px 11px;
            color: #1a1f26;
            background: #ffffff;
            font: inherit;
        }

        textarea {
            min-height: 140px;
            resize: vertical;
            line-height: 1.4;
        }

        input[type="checkbox"] {
            width: auto;
            min-width: 18px;
            min-height: 18px;
        }

        .checkbox-label {
            flex-direction: row;
            align-items: center;
            gap: 10px;
        }

        .actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .status {
            min-height: 22px;
            font-size: 0.92rem;
            color: #1d5f8f;
        }

        .content-empty {
            color: #667085;
        }

        .content-item {
            padding: 10px 0;
            border-bottom: 1px solid #e4e8ee;
        }

        .content-item:last-child {
            border-bottom: 0;
        }

        .content-vendor {
            display: block;
            margin-bottom: 4px;
            font-weight: 760;
        }

        .field-hint {
            color: #667085;
            font-size: 0.8rem;
            font-weight: 520;
        }

        @media (max-width: 760px) {
            .dashboard-header {
                align-items: stretch;
                flex-direction: column;
            }

            .dashboard-workspace {
                grid-template-columns: 1fr;
            }

            .dashboard-tabs {
                position: static;
                flex-direction: row;
                overflow-x: auto;
            }

            .dashboard-tab {
                width: auto;
                min-width: max-content;
            }
        }
    </style>
</head>
<body>
    <main class="dashboard-shell">
        <header class="dashboard-header">
            <h1>Content Dashboard</h1>
            <a class="dashboard-link" href="/" target="_blank" rel="noreferrer">Open Game</a>
        </header>
        <div class="dashboard-workspace">
            <nav class="dashboard-tabs" aria-label="Dashboard sections">
                <button class="dashboard-tab" type="button" data-dashboard-tab="vendors" aria-selected="true">Vendor Content</button>
                <button class="dashboard-tab" type="button" data-dashboard-tab="trails" aria-selected="false">Discovery Trails</button>
                <button class="dashboard-tab" type="button" data-dashboard-tab="preview" aria-selected="false">Live Preview</button>
            </nav>
            <section class="panel dashboard-page" data-dashboard-page="vendors" aria-labelledby="editor-title">
                <form id="content-form" class="form-stack">
                    <h2 id="editor-title">Vendor Content</h2>
                    <label>
                        Vendor
                        <select id="vendor-select" name="vendorId"></select>
                    </label>
                    <label>
                        Booth Description Override
                        <textarea id="description-input" name="descriptionOverride" spellcheck="true"></textarea>
                    </label>
                    <label>
                        Featured Items / Demos
                        <textarea id="featured-input" name="featuredItems" spellcheck="true"></textarea>
                    </label>
                    <label>
                        Announcements
                        <textarea id="announcement-input" name="announcements" spellcheck="true"></textarea>
                    </label>
                    <label>
                        Discovery Clue Text
                        <textarea id="clue-input" name="clueText" spellcheck="true"></textarea>
                    </label>
                    <div class="actions">
                        <button id="clear-button" type="button">Clear</button>
                        <button type="submit">Save Content</button>
                    </div>
                    <div id="status" class="status" role="status" aria-live="polite"></div>
                </form>
            </section>
            <section class="panel dashboard-page" data-dashboard-page="trails" aria-labelledby="trail-editor-title" hidden>
                <form id="trail-form" class="form-stack">
                    <h2 id="trail-editor-title">Discovery Trail Editor</h2>
                    <label>
                        Trail
                        <select id="trail-select" name="trailId"></select>
                    </label>
                    <label>
                        Trail Title
                        <input id="trail-title-input" name="title" type="text" autocomplete="off">
                    </label>
                    <label>
                        Description
                        <textarea id="trail-description-input" name="description" spellcheck="true"></textarea>
                    </label>
                    <label class="checkbox-label">
                        <input id="trail-ordered-input" name="ordered" type="checkbox">
                        Ordered encounter chain
                    </label>
                    <label>
                        Stops
                        <span class="field-hint">One per line: vendor id | clue text | goal text</span>
                        <textarea id="trail-stops-input" name="stops" spellcheck="true"></textarea>
                    </label>
                    <label>
                        Reward Points
                        <input id="trail-reward-points-input" name="rewardPoints" type="number" min="1" step="1">
                    </label>
                    <label>
                        Reward Description
                        <textarea id="trail-reward-description-input" name="rewardDescription" spellcheck="true"></textarea>
                    </label>
                    <label>
                        Completion Text
                        <textarea id="trail-completion-input" name="completionText" spellcheck="true"></textarea>
                    </label>
                    <div class="actions">
                        <button id="trail-reset-button" type="button">Reset</button>
                        <button type="submit">Save Trail</button>
                    </div>
                    <div id="trail-status" class="status" role="status" aria-live="polite"></div>
                </form>
            </section>
            <section class="panel dashboard-page" data-dashboard-page="preview" aria-labelledby="current-title" hidden>
                <div class="content-list">
                    <h2 id="current-title">Live Preview</h2>
                    <h2>Vendor Content</h2>
                    <div id="content-list"></div>
                    <h2>Discovery Trails</h2>
                    <div id="trail-list"></div>
                </div>
            </section>
        </div>
    </main>
    <script type="module" src="dashboard.js"></script>
</body>
</html>
